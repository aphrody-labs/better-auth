output:
  - success
  - failure

pre-commit:
  parallel: true
  commands:
    lint:
      run: bun lint --no-script --quiet --fix {staged_files}
      stage_fixed: true
    spell:
      run: bunx cspell --cache --no-progress --no-summary --no-must-find-files {staged_files}
    format:
      glob: "docs/**/*.{md,mdx}"
      root: "docs/"
      run: bunx remark {staged_files} --output --quiet
      stage_fixed: true
    lockfile:
      glob: "{package.json,bun.lock,packages/*/package.json}"
      run: bun install --frozen-lockfile --ignore-scripts
